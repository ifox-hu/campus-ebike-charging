name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci
      - run: npm test
      - name: Test local account service
        run: mvn -B -f server/pom.xml test
      - name: Build static demonstration
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          PAGES_AMAP_KEY: ${{ secrets.AMAP_WEB_KEY }}
          PAGES_AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
