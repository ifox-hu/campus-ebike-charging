name: Test and deploy Smart E-Bike Charging Management System
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            uni-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install and test management frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Test account and charging services
        run: mvn -B -f backend/pom.xml test
      - name: Verify H5 and WeChat shared client
        working-directory: uni-app
        run: |
          npm ci
          npm test
          npm run build:h5
          npm run build:mp-weixin
      - name: Build public management demo
        working-directory: frontend
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          PAGES_REQUIRE_AMAP: 'true'
          PAGES_AMAP_KEY: ${{ secrets.AMAP_WEB_KEY }}
          PAGES_AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy management frontend
        id: deployment
        uses: actions/deploy-pages@v4
