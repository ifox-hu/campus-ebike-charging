server.address=127.0.0.1
server.port=8092
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=EBIKE_ADMIN_SESSION
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:h2:file:./runtime/admin-accounts;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.default-property-inclusion=non_null
app.bootstrap.username=${EBIKE_ADMIN_USERNAME:admin}
app.bootstrap.password=${EBIKE_ADMIN_PASSWORD:Admin@123456}
logging.level.org.springframework.security=INFO
